<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Aphindra Weltkarte</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f19">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aphindra">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=Marcellus+SC&display=swap">
<style>
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; }
/* Layout: Kartentisch – Karte füllt die Fläche, rechts ein Notizbuch-Panel (auf dem Handy unten). Bewusst nur dunkel: Nachtlicht am Spieltisch. */
:root {
  --ink: #0c111c;
  --ink-2: #121a29;
  --panel: #151d2d;
  --panel-2: #1b2538;
  --line: #2a3650;
  --line-soft: #202b40;
  --text: #ebe5d6;
  --muted: #9ca6b8;
  --faint: #6c7790;
  --ember: #f2a65a;
  --ember-soft: rgba(242,166,90,.16);
  --amber: #f4b860; --teal: #63d6c4; --gold: #e9d37c; --mist: #c4ecff; --sky: #a3c8ff; --violet: #bb94ff;
  --ok: #7fd49a; --warn: #f2c25a; --hush: #9aa3c7; --crit: #ef7a6a;
  --f-display: "Marcellus SC", "Cormorant SC", Georgia, serif;
  --f-body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --panel-w: 400px;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--ink); color: var(--text); font-family: var(--f-body); font-size: 15px; line-height: 1.45; overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }

.app { display: grid; grid-template-columns: minmax(0,1fr) var(--panel-w); grid-template-rows: auto minmax(0,1fr); height: 100%; }
.bar { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line-soft); background: var(--ink-2); min-width: 0; }
.brand { font-family: var(--f-display); font-size: 20px; letter-spacing: .06em; white-space: nowrap; color: var(--text); }
.brand small { font-family: var(--f-mono); font-size: 10px; letter-spacing: .14em; color: var(--ember); margin-left: 8px; vertical-align: 3px; }
.crumbs { display: flex; align-items: center; gap: 4px; min-width: 0; flex: 1; overflow-x: auto; scrollbar-width: none; }
.crumbs::-webkit-scrollbar { display: none; }
.crumb { border: 0; background: none; padding: 4px 6px; border-radius: 6px; color: var(--muted); white-space: nowrap; font-size: 14px; }
.crumb:hover { color: var(--text); background: var(--line-soft); }
.crumb[aria-current="true"] { color: var(--text); font-weight: 700; }
.crumb-sep { color: var(--faint); font-size: 12px; }
.search { position: relative; width: 240px; flex: none; }
.search input { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px 7px 30px; font-size: 14px; }
.search svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; stroke: var(--faint); fill: none; stroke-width: 2; }
.results { position: absolute; top: calc(100% + 6px); right: 0; width: 340px; max-width: 80vw; max-height: 60vh; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 18px 40px rgba(0,0,0,.45); z-index: 30; padding: 6px; }
.res { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 7px; }
.res:hover, .res[aria-selected="true"] { background: var(--panel-2); }
.res b { font-weight: 500; }
.res span { color: var(--muted); font-size: 12px; grid-column: 1; }
.res i { font-style: normal; font-family: var(--f-mono); font-size: 10px; color: var(--faint); text-transform: uppercase; letter-spacing: .08em; grid-row: 1; grid-column: 2; align-self: center; }
.iconbtn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 10px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.iconbtn:hover { color: var(--text); border-color: var(--faint); }
.iconbtn[aria-pressed="true"] { color: var(--text); border-color: var(--ember); }

/* Karte */
.stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: radial-gradient(ellipse at 50% 40%, #131c2e, var(--ink) 70%); touch-action: none; }
#map { width: 100%; height: 100%; display: block; cursor: grab; user-select: none; -webkit-user-select: none; }
#map.dragging { cursor: grabbing; }
.shape { fill: transparent; stroke: rgba(235,229,214,.28); stroke-width: 1; vector-effect: non-scaling-stroke; cursor: pointer; transition: fill .18s, stroke .18s; fill-rule: evenodd; }
.shape.has-kids { stroke-dasharray: none; }
.shape.sonder { stroke-dasharray: 5 4; }
.shape:hover, .shape.hot { fill: color-mix(in srgb, var(--hue, var(--ember)) 16%, transparent); stroke: var(--hue, var(--ember)); stroke-width: 2; }
.shape.sel { fill: color-mix(in srgb, var(--hue, var(--ember)) 10%, transparent); stroke: var(--hue, var(--ember)); stroke-width: 1.6; }
.glow { fill: none; stroke: var(--hue, var(--ember)); vector-effect: non-scaling-stroke; pointer-events: none; fill-rule: evenodd; }
.glow.wide { stroke-width: 9; opacity: .32; filter: url(#blur6); }
.glow.core { stroke-width: 1.6; opacity: .95; }
.glow.pulse { animation: breathe 3.6s ease-in-out infinite; }
.hoverglow { fill: none; stroke: var(--hue, var(--ember)); stroke-width: 7; opacity: .45; vector-effect: non-scaling-stroke; pointer-events: none; filter: url(#blur6); fill-rule: evenodd; }
@keyframes breathe { 0%,100% { opacity: .22 } 50% { opacity: .5 } }
.dim { fill: rgba(6,9,16,.62); pointer-events: none; transition: opacity .3s; }
.route { fill: none; stroke: var(--ember); stroke-width: 2; stroke-dasharray: 6 5; vector-effect: non-scaling-stroke; pointer-events: none; opacity: .85; }
.route-hit { fill: none; stroke: transparent; stroke-width: 14; vector-effect: non-scaling-stroke; cursor: pointer; }
.route-hit:hover + .route, .route.hot { stroke-width: 3.2; opacity: 1; stroke: #ffd09a; }
.lbl { font-family: var(--f-display); fill: var(--text); paint-order: stroke; stroke: rgba(8,12,20,.85); stroke-linejoin: round; pointer-events: none; letter-spacing: .04em; }
.lbl.area { fill: #fff6e2; opacity: .92; }
.lbl.small { font-family: var(--f-body); font-weight: 500; letter-spacing: 0; }
.pin { cursor: pointer; }
.pin .hit { fill: transparent; }
.pin .ring { fill: none; stroke: var(--ember); stroke-width: 1.4; opacity: 0; }
.pin.quest .ring { opacity: .9; }
.pin:hover .sym, .pin.hot .sym { filter: url(#pinglow); }
.pin.sel .sym { stroke: #fff; }
.sym { stroke: #0b0f19; stroke-width: 1.2; }
.ctx { pointer-events: none; opacity: .55; }
.party .halo { fill: none; stroke: #ffe1b0; stroke-width: 1.5; animation: ping 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes ping { 0% { transform: scale(.6); opacity: .9 } 100% { transform: scale(2.2); opacity: 0 } }
.schema-bg { pointer-events: none; }
.zoom { position: absolute; right: 14px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 6px; }
.zoom button { width: 36px; height: 36px; border-radius: 9px; border: 1px solid var(--line); background: rgba(21,29,45,.92); font-size: 18px; line-height: 1; color: var(--text); }
.zoom button:hover { border-color: var(--ember); }
.hint { position: absolute; left: 14px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); max-width: min(520px, calc(100% - 90px)); font-size: 12.5px; color: var(--muted); background: rgba(12,17,28,.82); border: 1px solid var(--line-soft); border-radius: 9px; padding: 7px 10px; }
.hint-x { float: right; border: 0; background: none; color: var(--faint); font-size: 16px; line-height: 1; padding: 0 0 0 10px; }
.hint-x:hover { color: var(--text); }
.hint kbd { font-family: var(--f-mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--text); }
.mapname { position: absolute; left: 14px; top: 12px; font-family: var(--f-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); pointer-events: none; }
.toast { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font-size: 13px; }

/* Popover: Ebenen & Legende */
.pop { position: absolute; right: 14px; top: 12px; width: 300px; max-width: calc(100% - 28px); max-height: calc(100% - 80px); overflow: auto; background: rgba(21,29,45,.97); border: 1px solid var(--line); border-radius: 12px; padding: 14px; z-index: 20; box-shadow: 0 18px 40px rgba(0,0,0,.45); }
.pop h3 { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); margin: 0 0 8px; font-weight: 500; }
.pop h3:not(:first-child) { margin-top: 16px; }
.toggle { display: flex; align-items: center; gap: 10px; padding: 5px 0; font-size: 14px; cursor: pointer; }
.toggle input { accent-color: var(--ember); width: 15px; height: 15px; }
.toggle svg { width: 18px; height: 18px; flex: none; }
.legend-row { display: flex; align-items: center; gap: 10px; font-size: 13.5px; padding: 4px 0; color: var(--muted); }
.legend-row svg { width: 34px; height: 18px; flex: none; }
.legend-row b { color: var(--text); font-weight: 500; }

/* Panel */
.panel { background: var(--panel); border-left: 1px solid var(--line-soft); overflow-y: auto; min-width: 0; padding-block: 18px 28px; padding-left: 20px; padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.p-eyebrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 6px; }
.chip { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.chip.hue { color: var(--hue, var(--ember)); border-color: color-mix(in srgb, var(--hue, var(--ember)) 45%, transparent); }
.chip.preview { color: var(--ink); background: var(--ember); border-color: var(--ember); }
.p-title { font-family: var(--f-display); font-size: 28px; line-height: 1.1; margin: 4px 0 2px; text-wrap: balance; letter-spacing: .02em; }
.p-sub { color: var(--muted); font-size: 14px; }
.p-path { font-size: 12.5px; color: var(--faint); margin-top: 4px; }
.p-kurz { margin: 14px 0 0; font-size: 15.5px; max-width: 62ch; }
.p-atmo { margin: 12px 0 0; padding-left: 12px; border-left: 2px solid var(--line); color: var(--muted); font-style: italic; }
.now { margin-top: 14px; padding: 10px 12px; border-radius: 10px; background: var(--ember-soft); border: 1px solid rgba(242,166,90,.35); }
.now h4 { margin: 0 0 3px; font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ember); font-weight: 500; }
.now p { margin: 0; }
.facts { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 14px 0 0; font-size: 14px; }
.facts dt { color: var(--faint); }
.facts dd { margin: 0; }
.sec { margin-top: 20px; }
.sec > h4 { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 0 0 8px; font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); font-weight: 500; padding-bottom: 6px; border-bottom: 1px solid var(--line-soft); }
.sec > h4 span { letter-spacing: 0; }
.kids { display: grid; gap: 2px; }
.kid { display: grid; grid-template-columns: 18px 1fr auto; align-items: center; gap: 8px; width: 100%; border: 0; background: none; text-align: left; padding: 6px 6px; border-radius: 7px; font-size: 14.5px; }
.kid:hover, .kid.hot { background: var(--panel-2); }
.kid svg { width: 16px; height: 16px; }
.kid small { color: var(--faint); font-size: 12px; white-space: nowrap; }
.quest { padding: 10px 0; border-bottom: 1px solid var(--line-soft); }
.quest:last-child { border-bottom: 0; }
.q-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.q-name { font-weight: 700; font-size: 14.5px; }
.status { font-family: var(--f-mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; white-space: nowrap; border: 1px solid currentColor; }
.st-aktiv { color: var(--ok); }
.st-next { color: var(--warn); }
.st-hidden { color: var(--hush); }
.st-offen { color: var(--faint); }
.q-typ { font-size: 12px; color: var(--faint); margin-top: 1px; }
.q-text { font-size: 13.5px; color: var(--muted); margin-top: 5px; }
.q-text b { color: var(--text); font-weight: 500; }
.q-orte { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.q-orte button { font-size: 12px; border: 1px solid var(--line); background: none; border-radius: 6px; padding: 1px 6px; color: var(--muted); }
.q-orte button:hover { color: var(--text); border-color: var(--ember); }
.npc { display: grid; grid-template-columns: 1fr; padding: 6px 0; border-bottom: 1px dashed var(--line-soft); font-size: 14px; }
.npc:last-child { border-bottom: 0; }
.tiers { display: flex; gap: 4px; margin: 0 0 8px; }
.tiers button { flex: 1; font-family: var(--f-mono); font-size: 11px; padding: 4px 0; border: 1px solid var(--line); border-radius: 6px; color: var(--muted); background: transparent; cursor: pointer; }
.tiers button[aria-pressed="true"] { color: var(--ink); background: var(--ember); border-color: var(--ember); }
.tiers button small { opacity: .7; margin-left: 3px; }
.tier-note { font-size: 12px; color: var(--faint); margin: 0 0 6px; }
.crea { display: grid; grid-template-columns: 1fr auto; gap: 0 8px; padding: 5px 0; border-bottom: 1px dashed var(--line-soft); font-size: 14px; }
.crea:last-child { border-bottom: 0; }
.crea b { font-weight: 500; }
.crea .cr { font-family: var(--f-mono); font-size: 12px; color: var(--hue, var(--ember)); text-align: right; white-space: nowrap; }
.crea .cr i { font-style: normal; color: var(--faint); margin-left: 6px; font-size: 10.5px; }
.crea span { grid-column: 1 / -1; font-size: 12.5px; color: var(--muted); }
.crea.check .cr::after { content: ' ⚠'; color: var(--faint); }
.symp { font-size: 13px; color: var(--muted); border-left: 2px solid var(--ember); padding: 2px 0 2px 8px; margin: 0 0 8px; }
.ww { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.ww th { text-align: left; font-family: var(--f-mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); font-weight: 500; padding: 3px 4px 3px 0; }
.ww td { padding: 4px 4px 4px 0; vertical-align: top; border-top: 1px dashed var(--line-soft); color: var(--muted); }
.ww td:first-child { color: var(--ember); font-family: var(--f-mono); font-size: 11px; white-space: nowrap; }

.npc b { font-weight: 500; }
.npc span { color: var(--muted); font-size: 13px; }
.npc a, .npc button.at { font-size: 12px; color: var(--faint); background: none; border: 0; padding: 0; text-align: left; }
.npc a:hover, .npc button.at:hover { color: var(--ember); }
ul.plain { margin: 0; padding-left: 18px; display: grid; gap: 5px; font-size: 14px; }
ul.plain li::marker { color: var(--faint); }
.dm ul.plain li::marker { color: var(--ember); }
.offen ul.plain li { color: var(--muted); }
.more { border: 0; background: none; color: var(--ember); padding: 4px 0 0; font-size: 13px; }
.p-foot { margin-top: 24px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.p-foot a.iconbtn { text-decoration: none; }
.vaultname { font-size: 12px; color: var(--faint); border: 0; background: none; padding: 2px 0; }
.vaultname:hover { color: var(--text); }
.openmap { margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
.openmap .iconbtn { color: var(--text); border-color: var(--ember); background: var(--ember-soft); }
.empty { color: var(--faint); font-size: 13.5px; }

/* Spielerversion */
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.dmlink { margin-top: 14px; border: 0; background: none; color: var(--faint); font-size: 12px; padding: 0; text-decoration: underline; }
.dmbtn { border-color: var(--ember); color: var(--ember); }
.dmbtn[aria-pressed="true"] { background: var(--ember); color: var(--ink); }
.dmbtn[hidden], .netstate[hidden] { display: none; }
.netstate { position: absolute; left: 12px; bottom: 64px; z-index: 4; max-width: min(420px, calc(100% - 24px)); font-size: 12.5px; color: var(--muted); background: rgba(12,17,28,.86); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.wtext p { margin: 0 0 10px; font-size: 15px; }
.wtext p:last-child { margin-bottom: 0; }
.unknown { color: var(--faint); font-style: italic; margin: 12px 0 0; }
.note { padding: 7px 0; border-bottom: 1px dashed var(--line-soft); font-size: 14px; }
.note:last-child { border-bottom: 0; }
.note .who { font-family: var(--f-mono); font-size: 10.5px; color: var(--faint); letter-spacing: .06em; display: flex; justify-content: space-between; gap: 8px; }
.note .who button { border: 0; background: none; color: var(--faint); font-size: 11px; padding: 0; }
.note .who button:hover { color: var(--crit); }
.note p { margin: 2px 0 0; white-space: pre-wrap; }
.noteform { display: grid; gap: 6px; margin-top: 8px; }
.noteform textarea, .dmbox textarea, .dmbox input[type=text], .listedit textarea, .listedit input { width: 100%; background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; font: inherit; font-size: 14px; resize: vertical; }
.noteform button, .dmbox button, .listedit button { justify-self: start; }
.btnrow { display: flex; flex-wrap: wrap; gap: 6px; }
.dmbox { margin-top: 22px; border: 1px solid rgba(242,166,90,.45); border-radius: 10px; padding: 12px; background: rgba(242,166,90,.06); display: grid; gap: 8px; }
.dmbox h4 { margin: 0; font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ember); font-weight: 500; }
.dmbox .state { font-size: 13px; color: var(--muted); }
.dmbox .draft { font-size: 12.5px; color: var(--faint); border-left: 2px solid var(--line); padding-left: 8px; white-space: pre-wrap; max-height: 160px; overflow: auto; }
.dmbox label { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
.pin.unk { opacity: .45; }
.route.trail { stroke: #ffe1b0; stroke-dasharray: 2 5; opacity: .85; }
.overlay { position: absolute; inset: 0; z-index: 6; background: rgba(8,11,18,.72); display: flex; justify-content: center; align-items: flex-start; padding: 24px 16px; overflow: auto; }
.overlay .sheet { width: min(640px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px 18px 22px; }
.overlay .sheet h2 { font-family: var(--f-display); font-weight: 400; font-size: 24px; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.overlay .item { padding: 10px 0; border-top: 1px solid var(--line-soft); }
.overlay .item b { font-weight: 500; }
.overlay .item p { margin: 4px 0 6px; color: var(--muted); font-size: 14px; white-space: pre-wrap; }
.listedit { display: grid; gap: 6px; margin-top: 6px; }

@media (max-width: 860px) {
  :root { --panel-w: 100%; }
  .app { grid-template-columns: minmax(0,1fr); grid-template-rows: auto minmax(0, 58fr) minmax(0, 42fr); }
  .panel { border-left: 0; border-top: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
  .search { width: 150px; }
  .brand small, .hint { display: none; }
  .bar { flex-wrap: wrap; gap: 8px; }
  .crumbs { order: 3; flex-basis: 100%; }
  .p-title { font-size: 24px; }
}
@media (prefers-reduced-motion: reduce) {
  .glow.pulse, .party .halo { animation: none; }
  .shape { transition: none; }
}
</style>

</head>
<body>
<div class="app" id="app">
  <header class="bar">
    <div class="brand">Aphindra<small>Gruppe</small></div>
    <nav class="crumbs" id="crumbs" aria-label="Ebenen"></nav>
    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="q" type="search" placeholder="Ort, Person, Auftrag …" autocomplete="off" aria-label="Suchen">
      <div class="results" id="results" hidden role="listbox"></div>
    </div>

    list.forEach(q => { const it = h('div', 'item'); it.appendChild(questCard(q)); if (DMMODE) it.appendChild(editForm('quest', q.id, q)); sh.appendChild(it); });
    if (DMMODE) { const it = h('div', 'item'); it.appendChild(h('b', null, 'Neuer Auftrag')); it.appendChild(editForm('quest', null, { name: '', text: '', orte: [], status: 'offen', ord: list.length + 1 })); sh.appendChild(it); }
  } else {
    const list = Object.entries(NP).map(([id, p]) => Object.assign({ id }, p)).sort((a, b) => a.name.localeCompare(b.name, 'de'));
    if (!list.length) sh.appendChild(h('p', 'empty', 'Noch niemand eingetragen.'));
    list.forEach(p => {
      const it = h('div', 'item'); it.innerHTML = `<b>${esc(p.name)}</b><p>${esc(p.text || '')}</p>`;
      if (p.ort && N[p.ort] && (known(p.ort) || !isPin(N[p.ort]))) { const b = h('button', 'iconbtn', '↳ ' + esc(N[p.ort].name)); b.onclick = () => { closeOverlay(); go(p.ort); }; it.appendChild(b); }
      if (DMMODE) it.appendChild(editForm('npc', p.id, p));
      sh.appendChild(it);
    });
    if (DMMODE) { const it = h('div', 'item'); it.appendChild(h('b', null, 'Neue Person')); it.appendChild(editForm('npc', null, { name: '', text: '', ort: '' })); sh.appendChild(it); }
  }
  o.appendChild(sh); o.scrollTop = keepScroll;
}
function editForm(kind, id, d) {
  const f = h('details', 'listedit'); f.appendChild(h('summary', 'state', id ? 'Bearbeiten' : 'Anlegen'));
  const name = h('input'); name.type = 'text'; name.value = d.name || ''; name.placeholder = 'Name'; f.appendChild(name);
  const text = h('textarea'); text.rows = 3; text.value = d.text || ''; text.placeholder = 'Was die Gruppe weiß'; f.appendChild(text);
  const ort = h('input'); ort.type = 'text'; ort.value = kind === 'quest' ? (d.orte || []).join(', ') : (d.ort || ''); ort.placeholder = kind === 'quest' ? 'Orts-IDs, mit Komma (z. B. umbu, brunnen)' : 'Orts-ID (z. B. umbu)'; f.appendChild(ort);
  let stat = null;
  if (kind === 'quest') { stat = h('select'); STATI.forEach(s => { const op = h('option', null, s); op.value = s; if (s === (d.status || 'offen')) op.selected = true; stat.appendChild(op); }); stat.setAttribute('aria-label', 'Status'); f.appendChild(stat); }
  const row = h('div', 'btnrow');
  const sv = h('button', 'iconbtn', 'Speichern');
  sv.onclick = () => {
    const key = id || (name.value.trim().toLowerCase().normalize('NFD').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'eintrag') + '-' + Date.now().toString(36).slice(-4);
    const body = kind === 'quest' ? { name: name.value.trim(), text: text.value.trim(), orte: ort.value.split(',').map(s => s.trim()).filter(Boolean), status: stat.value, ord: d.ord || 99 } : { name: name.value.trim(), text: text.value.trim(), ort: ort.value.trim() || null };
    if (!body.name) return say('Bitte einen Namen eintragen.', 3000);
    write(() => put(kind, Object.assign({ id: key }, body)), 'Gespeichert.').then(ok => { if (ok) renderOverlay(true); });
  };
  row.appendChild(sv);
  if (id) { const del = h('button', 'iconbtn', 'Entfernen'); del.onclick = () => write(() => del(kind, id), 'Entfernt.').then(() => renderOverlay(true)); row.appendChild(del); }
  f.appendChild(row);
  return f;
}
$('btnQuests').onclick = () => openOverlay('quest');
$('btnNpcs').onclick = () => openOverlay('npc');
document.addEventListener('focusout', () => setTimeout(() => { if (panelPending && !panelBusy()) { renderPanel(true); renderOverlay(true); } }, 0));

/* ── Ebenen & Legende ── */
function renderPop() {
  const pop = $('pop'); pop.innerHTML = '<h3>Ebenen</h3>';
  const icon = { hauptstadt: 'hauptstadt', siedlung: 'siedlung', schluessel: 'schluessel', symptom: 'symptom', poi: 'poi' };
  LAYERS.forEach(l => {
    const lab = h('label', 'toggle');
    const cb = h('input'); cb.type = 'checkbox'; cb.id = 'lay-' + l.id; cb.checked = on[l.id] !== false;
    cb.onchange = () => { on[l.id] = cb.checked; store.set('layers', on); draw(); renderPanel(); };
    lab.appendChild(cb);
    const ic = icon[l.id] ? symSvg(icon[l.id]) : l.id === 'route' ? '<svg viewBox="0 0 18 18"><path d="M1 13 C6 3, 12 15, 17 5" stroke="var(--ember)" stroke-dasharray="3 2" fill="none" stroke-width="1.6"/></svg>' : l.id === 'quest' ? '<svg viewBox="-10 -10 20 20"><circle r="7" fill="none" stroke="var(--ember)" stroke-width="1.6"/><circle r="3" fill="#e9e2cf"/></svg>' : l.id === 'trail' ? '<svg viewBox="0 0 18 18"><path d="M1 13 C6 3, 12 15, 17 5" stroke="#ffe1b0" stroke-dasharray="2 3" fill="none" stroke-width="1.6"/></svg>' : '<svg viewBox="0 0 18 18"><text x="2" y="13" font-size="11" fill="currentColor" font-family="serif">Aa</text></svg>';
    lab.insertAdjacentHTML('beforeend', ic + `<span>${esc(l.name)}</span>`);
    pop.appendChild(lab);
  });
  pop.insertAdjacentHTML('beforeend', `<h3>Legende</h3>
    <div class="legend-row"><svg viewBox="0 0 34 18"><rect x="2" y="3" width="30" height="12" rx="2" fill="none" stroke="var(--ember)" stroke-width="1.6"/><rect x="2" y="3" width="30" height="12" rx="2" fill="none" stroke="var(--ember)" stroke-width="6" opacity=".25"/></svg><span><b>Leuchtende Grenze:</b> aktuelle Ebene</span></div>
    <div class="legend-row"><svg viewBox="0 0 34 18"><rect x="2" y="3" width="30" height="12" rx="2" fill="none" stroke="rgba(235,229,214,.5)"/></svg><span><b>Feine Linie:</b> Gebiet oder Bereich, Klick geht hinein</span></div>
    <div class="legend-row"><svg viewBox="0 0 34 18"><rect x="2" y="3" width="30" height="12" rx="2" fill="none" stroke="rgba(235,229,214,.5)" stroke-dasharray="4 3"/></svg><span><b>Gestrichelt:</b> Sondergebiet ohne Domäne</span></div>
    <div class="legend-row"><svg viewBox="-17 -9 34 18">${(() => { const g = el('g'); SYM.hauptstadt(g, SYMCOL.hauptstadt); el('path', { d: 'M6 -8h6v6', stroke: '#ffe3a8', 'stroke-width': 1.6, fill: 'none' }, g); return g.outerHTML; })()}</svg><span><b>Haken am Symbol:</b> öffnet eine eigene Karte</span></div>
    <div class="legend-row"><svg viewBox="-17 -9 34 18"><circle r="7" fill="none" stroke="#ffe1b0"/><circle r="3" fill="#ffe1b0"/></svg><span><b>Die Gruppe</b>${G && G.stand ? ' (' + esc(G.stand) + ')' : ''}; gepunktet: ihr bisheriger Weg</span></div>
    <h3>Bedienung</h3>
    <div class="legend-row" style="display:block">Fahren zeigt Infos im Panel. Klick geht eine Ebene tiefer, bei Orten mit Karte öffnet sich die Stadtkarte. Die Karte zeigt nur, was eure Gruppe bereits weiß; neue Orte und Wissen erscheinen, sobald die Spielleitung sie freigibt. <kbd>Esc</kbd>, Doppelklick ins Leere oder die Brotkrümel führen zurück.</div>`);
  const dl = h('button', 'dmlink', 'Spielleitung'); dl.onclick = () => { $('btnLayers').click(); openLogin(); }; pop.appendChild(dl);
}
$('btnLayers').onclick = () => { const p = $('pop'); p.hidden = !p.hidden; $('btnLayers').setAttribute('aria-pressed', String(!p.hidden)); if (!p.hidden) renderPop(); };

/* ── Suche ── */
let INDEX = [];
function buildIndex() {
  INDEX = [
    ...Object.values(N).filter(n => n.type !== 'welt' && (!isPin(n) || known(n.id))).map(n => ({ label: n.name, sub: ancestors(n.id).slice(1, -1).map(a => N[a].name).join(' › '), tag: n.type === 'ort' ? (KIND[n.kind] || 'Ort') : TYPE[n.type], go: n.id })),
    ...Object.values(NP).filter(p => p.ort && N[p.ort]).map(p => ({ label: p.name, sub: (p.text || '').slice(0, 60) + ' · ' + N[p.ort].name, tag: 'Person', go: p.ort })),
    ...qList().filter(q => q.orte.some(o => N[o])).map(q => ({ label: q.name, sub: q.status, tag: 'Auftrag', go: q.orte.find(o => N[o]) }))
  ];
}
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
let resSel = 0;
$('q').addEventListener('input', () => {
  const v = norm($('q').value.trim()); const box = $('results');
  if (!v) { box.hidden = true; return; }
  const hits = INDEX.filter(x => (norm(x.label).includes(v) || norm(x.sub).includes(v))).sort((a, b) => { const r = x => { const i = norm(x.label).indexOf(v); return i < 0 ? 999 : i; }; return r(a) - r(b); }).slice(0, 12);
  box.innerHTML = ''; resSel = 0;
  if (!hits.length) { box.innerHTML = '<div class="empty" style="padding:8px 10px">Nichts gefunden.</div>'; box.hidden = false; return; }
  hits.forEach((x, i) => { const b = h('button', 'res', `<b>${esc(x.label)}</b><i>${esc(x.tag)}</i><span>${esc(x.sub)}</span>`); b.setAttribute('role', 'option'); if (!i) b.setAttribute('aria-selected', 'true'); b.onclick = () => { $('q').value = ''; box.hidden = true; go(x.go); }; box.appendChild(b); });
  box.hidden = false;
});
$('q').addEventListener('keydown', e => {
  const items = [...$('results').querySelectorAll('.res')];
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); resSel = (resSel + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length; items.forEach((b, i) => b.setAttribute('aria-selected', String(i === resSel))); }
  if (e.key === 'Enter' && items[resSel]) items[resSel].click();
  if (e.key === 'Escape') { $('q').value = ''; $('results').hidden = true; }
});
document.addEventListener('click', e => { if (!e.target.closest('.search')) $('results').hidden = true; });

/* ── Zoom & Verschieben ── */
const drag = { on: false, moved: false, x: 0, y: 0, pts: new Map(), dist: 0 };
const toMap = (cx, cy) => { const r = svg.getBoundingClientRect(), v = S.view; return [v.x + (cx - r.left) / r.width * v.w, v.y + (cy - r.top) / r.height * v.h]; };
function zoomAt(f, cx, cy) {
  const v = S.view, [mx, my] = toMap(cx, cy);
  const w = Math.min(Math.max(v.w * f, 18), 1600), k = w / v.w;
  S.view = { x: mx - (mx - v.x) * k, y: my - (my - v.y) * k, w, h: v.h * k }; applyView();
}
svg.addEventListener('wheel', e => { e.preventDefault(); zoomAt(Math.exp(e.deltaY * 0.0015), e.clientX, e.clientY); }, { passive: false });
svg.addEventListener('pointerdown', e => { drag.pts.set(e.pointerId, [e.clientX, e.clientY]); drag.on = true; drag.moved = false; drag.x = e.clientX; drag.y = e.clientY; if (drag.pts.size === 2) { const [a, b] = [...drag.pts.values()]; drag.dist = Math.hypot(a[0] - b[0], a[1] - b[1]); } });
svg.addEventListener('pointermove', e => {
  if (!drag.on || !drag.pts.has(e.pointerId)) return;
  const prev = drag.pts.get(e.pointerId); drag.pts.set(e.pointerId, [e.clientX, e.clientY]);
  if (drag.pts.size === 2) { const [a, b] = [...drag.pts.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]); if (drag.dist) zoomAt(drag.dist / d, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2); drag.dist = d; drag.moved = true; return; }
  const dx = e.clientX - prev[0], dy = e.clientY - prev[1];
  if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) > 4) { if (!drag.moved) { drag.moved = true; svg.classList.add('dragging'); try { svg.setPointerCapture(e.pointerId); } catch {} } }
  if (!drag.moved) return;
  const r = svg.getBoundingClientRect(); S.view.x -= dx / r.width * S.view.w; S.view.y -= dy / r.height * S.view.h; applyView();
});
const endDrag = e => { drag.pts.delete(e.pointerId); if (!drag.pts.size) { drag.on = false; svg.classList.remove('dragging'); setTimeout(() => drag.moved = false, 0); } drag.dist = 0; };
svg.addEventListener('pointerup', endDrag); svg.addEventListener('pointercancel', endDrag);
svg.addEventListener('click', e => { if (drag.moved) return; if (e.target === svg || e.target.closest('#lyBase') || e.target.id === 'dimRect') { if (S.sel) { S.sel = null; draw(); renderPanel(); } } });
svg.addEventListener('dblclick', e => { if (e.target.closest('[data-id]')) return; up(); });
$('zin').onclick = () => { const r = svg.getBoundingClientRect(); zoomAt(0.7, r.left + r.width / 2, r.top + r.height / 2); };
$('zout').onclick = () => { const r = svg.getBoundingClientRect(); zoomAt(1 / 0.7, r.left + r.width / 2, r.top + r.height / 2); };
$('zfit').onclick = () => setView(bboxOf(S.focus), true);
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea, select')) return;
  if (e.key === 'Escape') { if ($('ovl')) { closeOverlay(); return; } if (!$('pop').hidden) { $('btnLayers').click(); return; } if (S.sel) { S.sel = null; draw(); renderPanel(); return; } up(); }
  if (e.key === '+' || e.key === '=') $('zin').click();
  if (e.key === '-') $('zout').click();
  if (e.key === '/') { e.preventDefault(); $('q').focus(); }
});
window.addEventListener('resize', () => setView(bboxOf(S.focus)));

/* ── Adresse (#ort) ── */
function hashSet(id) { const v = id.replace(/_/g, '-'); if (location.hash.slice(1) !== v) history.replaceState(null, '', '#' + v); }
function fromHash() { const v = location.hash.slice(1).replace(/-/g, '_'); return N[v] ? v : null; }
window.addEventListener('hashchange', () => { const id = fromHash(); if (id && id !== (S.sel || S.focus)) go(id, { instant: true }); });

/* ── Start ── */
const hideHint = () => { $('hint').hidden = true; store.set('hint', false); };
$('hintX').onclick = hideHint;
if (store.get('hint', true) === false) $('hint').hidden = true;
/* ── Aktualisieren nach neuen Daten ── */
let netErr = false, refreshQ = false, wLoaded = false, pendingStart = null;
function refresh() {
  if (refreshQ) return; refreshQ = true;
  requestAnimationFrame(() => {
    refreshQ = false;
    rebuildTree(); buildIndex();
    if (!N[S.focus] || (S.map !== 'world' && !Object.values(N).some(n => n.map === S.map && (n.id === 'world' || ownMap(n.id))))) { S.focus = 'world'; S.sel = null; S.map = '__'; go('world', { instant: true }); return; }
    if (S.sel && !N[S.sel]) S.sel = null;
    if (S.hover && !N[S.hover]) S.hover = null;
    draw(); renderPanel(); renderOverlay();
    if (pendingStart && wLoaded) { const s = pendingStart; pendingStart = null; if (N[s]) go(s, { instant: true }); }
  });
}

/* ── Gerät: Schlüssel für eigene Notizen ── */
let MYKEY = store.get('key', null), MYHASH = null;
if (!MYKEY) { const b = new Uint8Array(32); crypto.getRandomValues(b); MYKEY = [...b].map(x => x.toString(16).padStart(2, '0')).join(''); store.set('key', MYKEY); }
async function hashKey() {
  try { const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(MYKEY)); MYHASH = [...new Uint8Array(d)].map(x => x.toString(16).padStart(2, '0')).join(''); } catch { MYHASH = null; }
}

/* ── Datenbank ── */
const CFG = window.APH_CONFIG || {};
let sb = null;
const toMapById = rows => Object.fromEntries((rows || []).map(r => [r.id, r]));
async function loadTable(t) {
  const r = await sb.from(t).select('*');
  if (r.error) throw r.error;
  return r.data || [];
}
const LOADERS = {
  wissen: rows => { W = toMapById(rows); wLoaded = true; },
  gruppe: rows => { G = rows.find(r => r.id === 'stand') || null; },
  quest: rows => { Q = toMapById(rows); },
  npc: rows => { NP = toMapById(rows); },
  notiz: rows => { NOTES = rows; },
  vorrat: rows => { VOR = toMapById(rows); }
};
async function reload(only) {
  if (!sb) return;
  const tabs = only ? [only] : Object.keys(LOADERS).filter(t => t !== 'vorrat' || OWNER);
  try {
    const res = await Promise.all(tabs.map(loadTable));
    tabs.forEach((t, i) => LOADERS[t](res[i]));
    if (netErr) { netErr = false; say(''); }
  } catch (e) { netErr = true; say('Die Karte erreicht ihre Daten gerade nicht. Bitte Internetverbindung prüfen.'); }
  refresh();
}
let channel = null;
function subscribe() {
  if (channel) sb.removeChannel(channel);
  channel = sb.channel('aphindra');
  Object.keys(LOADERS).forEach(t => { if (t !== 'vorrat' || OWNER) channel.on('postgres_changes', { event: '*', schema: 'public', table: t }, () => reload(t)); });
  channel.subscribe();
}
async function checkOwner() {
  const { data } = await sb.auth.getSession();
  let own = false;
  if (data && data.session) { const r = await sb.rpc('ist_spielleitung'); own = !r.error && r.data === true; }
  OWNER = own;
  $('btnDM').hidden = !OWNER;
  DMMODE = OWNER && store.get('dm', false);
  $('btnDM').setAttribute('aria-pressed', String(DMMODE));
  if (!OWNER) VOR = {};
}
async function connect() {
  if (!window.supabase || !CFG.url || !CFG.key) { say('Die Karte ist noch nicht mit ihrer Datenbank verbunden.'); return; }
  sb = window.supabase.createClient(CFG.url, CFG.key, { auth: { persistSession: true, storageKey: 'aph-auth' } });
  say('Lade die Karte …');
  await hashKey();
  await checkOwner();
  await reload();
  if (!netErr) say('');
  subscribe();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) reload(); });
}

/* ── Anmeldung der Spielleitung ── */
function openLogin() {
  closeOverlay();
  const o = h('div', 'overlay'); o.id = 'ovl'; ovlKind = 'login';
  o.onclick = e => { if (e.target === o) closeOverlay(); };
  const sh = h('div', 'sheet'); sh.setAttribute('role', 'dialog'); sh.setAttribute('aria-label', 'Spielleitung');
  if (OWNER) {
    sh.innerHTML = '<h2><span>Spielleitung</span></h2><p class="state">Du bist als Spielleitung angemeldet.</p>';
    const row = h('div', 'btnrow');
    const out = h('button', 'iconbtn', 'Abmelden'); out.onclick = async () => { await sb.auth.signOut(); await checkOwner(); closeOverlay(); subscribe(); refresh(); };
    const x = h('button', 'iconbtn', 'Schließen'); x.onclick = closeOverlay;
    row.appendChild(out); row.appendChild(x); sh.appendChild(row);
  } else {
    sh.innerHTML = `<h2><span>Spielleitung anmelden</span></h2>
      <form class="listedit" id="loginForm">
        <input type="text" id="lmail" autocomplete="username" placeholder="E-Mail" aria-label="E-Mail">
        <input type="password" id="lpass" autocomplete="current-password" placeholder="Passwort" aria-label="Passwort" style="width:100%;background:var(--panel-2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px 9px;font:inherit;font-size:14px">
        <div class="btnrow"><button class="iconbtn" type="submit">Anmelden</button><button class="iconbtn" type="button" id="lcancel">Abbrechen</button></div>
      </form>`;
    o.appendChild(sh); $('stage').appendChild(o);
    sh.querySelector('#lcancel').onclick = closeOverlay;
    sh.querySelector('#loginForm').onsubmit = async e => {
      e.preventDefault();
      const r = await sb.auth.signInWithPassword({ email: $('lmail').value.trim(), password: $('lpass').value });
      if (r.error) return say('Anmeldung fehlgeschlagen: ' + r.error.message, 6000);
      await checkOwner();
      if (!OWNER) { say('Angemeldet, aber nicht als Spielleitung freigeschaltet.', 6000); return; }
      DMMODE = true; store.set('dm', true); $('btnDM').setAttribute('aria-pressed', 'true');
      closeOverlay(); subscribe(); reload();
    };
    $('lmail').focus();
    return;
  }
  o.appendChild(sh); $('stage').appendChild(o);
}
const _renderOverlay = renderOverlay;
renderOverlay = function (force) { if (ovlKind === 'login') return; return _renderOverlay(force); };
$('btnDM').onclick = () => { DMMODE = !DMMODE; store.set('dm', DMMODE); $('btnDM').setAttribute('aria-pressed', String(DMMODE)); refresh(); };

/* ── Start ── */
rebuildTree(); buildIndex();
drawBase();
S.view = null;
draw(); setView({ x: 0, y: 0, w: 1000, h: 750 }); renderPanel();
pendingStart = location.hash.slice(1).replace(/-/g, '_') || null;
if (pendingStart === 'spielleitung') { pendingStart = null; history.replaceState(null, '', location.pathname); setTimeout(() => connect().then(openLogin), 0); }
else connect();
})();
</script>
