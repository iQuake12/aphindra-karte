<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Aphindra Weltkarte</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f19">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aphindra">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=Marcellus+SC&display=swap">
<style>
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; }
/* Layout: Kartentisch – Karte füllt die Fläche, rechts ein Notizbuch-Panel (auf dem Handy unten). Bewusst nur dunkel: Nachtlicht am Spieltisch. */
:root {
  --ink: #0c111c;
  --ink-2: #121a29;
  --panel: #151d2d;
  --panel-2: #1b2538;
  --line: #2a3650;
  --line-soft: #202b40;
  --text: #ebe5d6;
  --muted: #9ca6b8;
  --faint: #6c7790;
  --ember: #f2a65a;
  --ember-soft: rgba(242,166,90,.16);
  --amber: #f4b860; --teal: #63d6c4; --gold: #e9d37c; --mist: #c4ecff; --sky: #a3c8ff; --violet: #bb94ff;
  --ok: #7fd49a; --warn: #f2c25a; --hush: #9aa3c7; --crit: #ef7a6a;
  --f-display: "Marcellus SC", "Cormorant SC", Georgia, serif;
  --f-body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --panel-w: 400px;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--ink); color: var(--text); font-family: var(--f-body); font-size: 15px; line-height: 1.45; overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }

.app { display: grid; grid-template-columns: minmax(0,1fr) var(--panel-w); grid-template-rows: auto minmax(0,1fr); height: 100%; }
.bar { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line-soft); background: var(--ink-2); min-width: 0; }
.brand { font-family: var(--f-display); font-size: 20px; letter-spacing: .06em; white-space: nowrap; color: var(--text); }
.brand small { font-family: var(--f-mono); font-size: 10px; letter-spacing: .14em; color: var(--ember); margin-left: 8px; vertical-align: 3px; }
.crumbs { display: flex; align-items: center; gap: 4px; min-width: 0; flex: 1; overflow-x: auto; scrollbar-width: none; }
.crumbs::-webkit-scrollbar { display: none; }
.crumb { border: 0; background: none; padding: 4px 6px; border-radius: 6px; color: var(--muted); white-space: nowrap; font-size: 14px; }
.crumb:hover { color: var(--text); background: var(--line-soft); }
.crumb[aria-current="true"] { color: var(--text); font-weight: 700; }
.crumb-sep { color: var(--faint); font-size: 12px; }
.search { position: relative; width: 240px; flex: none; }
.search input { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px 7px 30px; font-size: 14px; }
.search svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; stroke: var(--faint); fill: none; stroke-width: 2; }
.results { position: absolute; top: calc(100% + 6px); right: 0; width: 340px; max-width: 80vw; max-height: 60vh; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 18px 40px rgba(0,0,0,.45); z-index: 30; padding: 6px; }
.res { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 7px; }
.res:hover, .res[aria-selected="true"] { background: var(--panel-2); }
.res b { font-weight: 500; }
.res span { color: var(--muted); font-size: 12px; grid-column: 1; }
.res i { font-style: normal; font-family: var(--f-mono); font-size: 10px; color: var(--faint); text-transform: uppercase; letter-spacing: .08em; grid-row: 1; grid-column: 2; align-self: center; }
.iconbtn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 10px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.iconbtn:hover { color: var(--text); border-color: var(--faint); }
.iconbtn[aria-pressed="true"] { color: var(--text); border-color: var(--ember); }

/* Karte */
.stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: radial-gradient(ellipse at 50% 40%, #131c2e, var(--ink) 70%); touch-action: none; }
#map { width: 100%; height: 100%; display: block; cursor: grab; user-select: none; -webkit-user-select: none; }
#map.dragging { cursor: grabbing; }
.shape { fill: transparent; stroke: rgba(235,229,214,.28); stroke-width: 1; vector-effect: non-scaling-stroke; cursor: pointer; transition: fill .18s, stroke .18s; fill-rule: evenodd; }
.shape.has-kids { stroke-dasharray: none; }
.shape.sonder { stroke-dasharray: 5 4; }
.shape:hover, .shape.hot { fill: color-mix(in srgb, var(--hue, var(--ember)) 16%, transparent); stroke: var(--hue, var(--ember)); stroke-width: 2; }
.shape.sel { fill: color-mix(in srgb, var(--hue, var(--ember)) 10%, transparent); stroke: var(--hue, var(--ember)); stroke-width: 1.6; }
.glow { fill: none; stroke: var(--hue, var(--ember)); vector-effect: non-scaling-stroke; pointer-events: none; fill-rule: evenodd; }
.glow.wide { stroke-width: 9; opacity: .32; filter: url(#blur6); }
.glow.core { stroke-width: 1.6; opacity: .95; }
.glow.pulse { animation: breathe 3.6s ease-in-out infinite; }
.hoverglow { fill: none; stroke: var(--hue, var(--ember)); stroke-width: 7; opacity: .45; vector-effect: non-scaling-stroke; pointer-events: none; filter: url(#blur6); fill-rule: evenodd; }
@keyframes breathe { 0%,100% { opacity: .22 } 50% { opacity: .5 } }
.dim { fill: rgba(6,9,16,.62); pointer-events: none; transition: opacity .3s; }
.route { fill: none; stroke: var(--ember); stroke-width: 2; stroke-dasharray: 6 5; vector-effect: non-scaling-stroke; pointer-events: none; opacity: .85; }
.route-hit { fill: none; stroke: transparent; stroke-width: 14; vector-effect: non-scaling-stroke; cursor: pointer; }
.route-hit:hover + .route, .route.hot { stroke-width: 3.2; opacity: 1; stroke: #ffd09a; }
.lbl { font-family: var(--f-display); fill: var(--text); paint-order: stroke; stroke: rgba(8,12,20,.85); stroke-linejoin: round; pointer-events: none; letter-spacing: .04em; }
.lbl.area { fill: #fff6e2; opacity: .92; }
.lbl.small { font-family: var(--f-body); font-weight: 500; letter-spacing: 0; }
.pin { cursor: pointer; }
.pin .hit { fill: transparent; }
.pin .ring { fill: none; stroke: var(--ember); stroke-width: 1.4; opacity: 0; }
.pin.quest .ring { opacity: .9; }
.pin:hover .sym, .pin.hot .sym { filter: url(#pinglow); }
.pin.sel .sym { stroke: #fff; }
.sym { stroke: #0b0f19; stroke-width: 1.2; }
.ctx { pointer-events: none; opacity: .55; }
.party .halo { fill: none; stroke: #ffe1b0; stroke-width: 1.5; animation: ping 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes ping { 0% { transform: scale(.6); opacity: .9 } 100% { transform: scale(2.2); opacity: 0 } }
.schema-bg { pointer-events: none; }
.zoom { position: absolute; right: 14px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 6px; }
.zoom button { width: 36px; height: 36px; border-radius: 9px; border: 1px solid var(--line); background: rgba(21,29,45,.92); font-size: 18px; line-height: 1; color: var(--text); }
.zoom button:hover { border-color: var(--ember); }
.hint { position: absolute; left: 14px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); max-width: min(520px, calc(100% - 90px)); font-size: 12.5px; color: var(--muted); background: rgba(12,17,28,.82); border: 1px solid var(--line-soft); border-radius: 9px; padding: 7px 10px; }
.hint-x { float: right; border: 0; background: none; color: var(--faint); font-size: 16px; line-height: 1; padding: 0 0 0 10px; }
.hint-x:hover { color: var(--text); }
.hint kbd { font-family: var(--f-mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--text); }
.mapname { position: absolute; left: 14px; top: 12px; font-family: var(--f-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); pointer-events: none; }
.toast { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font-size: 13px; }

/* Popover: Ebenen & Legende */
.pop { position: absolute; right: 14px; top: 12px; width: 300px; max-width: calc(100% - 28px); max-height: calc(100% - 80px); overflow: auto; background: rgba(21,29,45,.97); border: 1px solid var(--line); border-radius: 12px; padding: 14px; z-index: 20; box-shadow: 0 18px 40px rgba(0,0,0,.45); }
.pop h3 { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); margin: 0 0 8px; font-weight: 500; }
.pop h3:not(:first-child) { margin-top: 16px; }
.toggle { display: flex; align-items: center; gap: 10px; padding: 5px 0; font-size: 14px; cursor: pointer; }
.toggle input { accent-color: var(--ember); width: 15px; height: 15px; }
.toggle svg { width: 18px; height: 18px; flex: none; }
.legend-row { display: flex; align-items: center; gap: 10px; font-size: 13.5px; padding: 4px 0; color: var(--muted); }
.legend-row svg { width: 34px; height: 18px; flex: none; }
.legend-row b { color: var(--text); font-weight: 500; }

/* Panel */
.panel { background: var(--panel); border-left: 1px solid var(--line-soft); overflow-y: auto; min-width: 0; padding-block: 18px 28px; padding-left: 20px; padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.p-eyebrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 6px; }
.chip { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.chip.hue { color: var(--hue, var(--ember)); border-color: color-mix(in srgb, var(--hue, var(--ember)) 45%, transparent); }
.chip.preview { color: var(--ink); background: var(--ember); border-color: var(--ember); }
.p-title { font-family: var(--f-display); font-size: 28px; line-height: 1.1; margin: 4px 0 2px; text-wrap: balance; letter-spacing: .02em; }
.p-sub { color: var(--muted); font-size: 14px; }
.p-path { font-size: 12.5px; color: var(--faint); margin-top: 4px; }
.p-kurz { margin: 14px 0 0; font-size: 15.5px; max-width: 62ch; }
.p-atmo { margin: 12px 0 0; padding-left: 12px; border-left: 2px solid var(--line); color: var(--muted); font-style: italic; }
.now { margin-top: 14px; padding: 10px 12px; border-radius: 10px; background: var(--ember-soft); border: 1px solid rgba(242,166,90,.35); }
.now h4 { margin: 0 0 3px; font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ember); font-weight: 500; }
.now p { margin: 0; }
.facts { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 14px 0 0; font-size: 14px; }
.facts dt { color: var(--faint); }
.facts dd { margin: 0; }
.sec { margin-top: 20px; }
.sec > h4 { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 0 0 8px; font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); font-weight: 500; padding-bottom: 6px; border-bottom: 1px solid var(--line-soft); }
.sec > h4 span { letter-spacing: 0; }
.kids { display: grid; gap: 2px; }
.kid { display: grid; grid-template-columns: 18px 1fr auto; align-items: center; gap: 8px; width: 100%; border: 0; background: none; text-align: left; padding: 6px 6px; border-radius: 7px; font-size: 14.5px; }
.kid:hover, .kid.hot { background: var(--panel-2); }
.kid svg { width: 16px; height: 16px; }
.kid small { color: var(--faint); font-size: 12px; white-space: nowrap; }
.quest { padding: 10px 0; border-bottom: 1px solid var(--line-soft); }
.quest:last-child { border-bottom: 0; }
.q-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.q-name { font-weight: 700; font-size: 14.5px; }
.status { font-family: var(--f-mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; white-space: nowrap; border: 1px solid currentColor; }
.st-aktiv { color: var(--ok); }
.st-next { color: var(--warn); }
.st-hidden { color: var(--hush); }
.st-offen { color: var(--faint); }
.q-typ { font-size: 12px; color: var(--faint); margin-top: 1px; }
.q-text { font-size: 13.5px; color: var(--muted); margin-top: 5px; }
.q-text b { color: var(--text); font-weight: 500; }
.q-orte { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.q-orte button { font-size: 12px; border: 1px solid var(--line); background: none; border-radius: 6px; padding: 1px 6px; color: var(--muted); }
.q-orte button:hover { color: var(--text); border-color: var(--ember); }
.npc { display: grid; grid-template-columns: 1fr; padding: 6px 0; border-bottom: 1px dashed var(--line-soft); font-size: 14px; }
.npc:last-child { border-bottom: 0; }
.tiers { display: flex; gap: 4px; margin: 0 0 8px; }
.tiers button { flex: 1; font-family: var(--f-mono); font-size: 11px; padding: 4px 0; border: 1px solid var(--line); border-radius: 6px; color: var(--muted); background: transparent; cursor: pointer; }
.tiers button[aria-pressed="true"] { color: var(--ink); background: var(--ember); border-color: var(--ember); }
.tiers button small { opacity: .7; margin-left: 3px; }
.tier-note { font-size: 12px; color: var(--faint); margin: 0 0 6px; }
.crea { display: grid; grid-template-columns: 1fr auto; gap: 0 8px; padding: 5px 0; border-bottom: 1px dashed var(--line-soft); font-size: 14px; }
.crea:last-child { border-bottom: 0; }
.crea b { font-weight: 500; }
.crea .cr { font-family: var(--f-mono); font-size: 12px; color: var(--hue, var(--ember)); text-align: right; white-space: nowrap; }
.crea .cr i { font-style: normal; color: var(--faint); margin-left: 6px; font-size: 10.5px; }
.crea span { grid-column: 1 / -1; font-size: 12.5px; color: var(--muted); }
.crea.check .cr::after { content: ' ⚠'; color: var(--faint); }
.symp { font-size: 13px; color: var(--muted); border-left: 2px solid var(--ember); padding: 2px 0 2px 8px; margin: 0 0 8px; }
.ww { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.ww th { text-align: left; font-family: var(--f-mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); font-weight: 500; padding: 3px 4px 3px 0; }
.ww td { padding: 4px 4px 4px 0; vertical-align: top; border-top: 1px dashed var(--line-soft); color: var(--muted); }
.ww td:first-child { color: var(--ember); font-family: var(--f-mono); font-size: 11px; white-space: nowrap; }

.npc b { font-weight: 500; }
.npc span { color: var(--muted); font-size: 13px; }
.npc a, .npc button.at { font-size: 12px; color: var(--faint); background: none; border: 0; padding: 0; text-align: left; }
.npc a:hover, .npc button.at:hover { color: var(--ember); }
ul.plain { margin: 0; padding-left: 18px; display: grid; gap: 5px; font-size: 14px; }
ul.plain li::marker { color: var(--faint); }
.dm ul.plain li::marker { color: var(--ember); }
.offen ul.plain li { color: var(--muted); }
.more { border: 0; background: none; color: var(--ember); padding: 4px 0 0; font-size: 13px; }
.p-foot { margin-top: 24px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.p-foot a.iconbtn { text-decoration: none; }
.vaultname { font-size: 12px; color: var(--faint); border: 0; background: none; padding: 2px 0; }
.vaultname:hover { color: var(--text); }
.openmap { margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
.openmap .iconbtn { color: var(--text); border-color: var(--ember); background: var(--ember-soft); }
.empty { color: var(--faint); font-size: 13.5px; }

/* Spielerversion */
/* Eigene Markierungen */
.mark { cursor: pointer; }
.mark .hit { fill: transparent; }
.mark .mk { stroke: #0b0f19; stroke-width: 1.6; filter: drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
.mark .mkg { font-size: 10px; fill: #0b0f19; font-weight: 700; pointer-events: none; font-family: system-ui, sans-serif; }
.mark.done .mk { opacity: .55; }
.mark.done .mkl { opacity: .6; }
.mark.sel .mk, .mark:focus-visible .mk, .mark:hover .mk { stroke: #fff; stroke-width: 2.2; }
.mark .mkok { fill: #59c76a; stroke: #0b0f19; stroke-width: 1; }
.mark .mkno { fill: #e05555; stroke: #0b0f19; stroke-width: 1; }
.mark .mkokp { fill: none; stroke: #0b0f19; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
svg.placing { cursor: crosshair; }
.mkkats { display: flex; flex-wrap: wrap; gap: 6px; }
.mkkat { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel-2); color: var(--muted); border-radius: 999px; padding: 4px 10px 4px 4px; font: inherit; font-size: 13px; cursor: pointer; }
.mkkat.on { color: var(--text); border-color: var(--ember); background: var(--ember-soft); }
.mkkats.small .mkkat { font-size: 12px; }
.mkkats.small .mkkat:not(.on) { opacity: .55; }
.mkdot { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--c); color: #0b0f19; font-size: 11px; font-weight: 700; border: 1px solid #0b0f19; flex: none; }
.cal-sub .mkdot { width: 16px; height: 16px; font-size: 9px; vertical-align: middle; }
.mkrow { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.mkrow input[type=checkbox] { width: auto; }
.mkctl { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin: 10px 0 8px; }
.mkctl input[type=text] { flex: 1 1 180px; min-width: 0; background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; font: inherit; font-size: 14px; }
.mklist { display: grid; gap: 2px; margin-top: 6px; }
.mkitem { display: grid; gap: 2px; text-align: left; background: none; border: 0; border-top: 1px solid var(--line-soft); padding: 9px 4px; color: var(--text); font: inherit; cursor: pointer; }
.mkitem:hover, .mkitem:focus-visible { background: var(--panel-2); }
.mkitem b { font-weight: 500; }
.mkitem .mktx { color: var(--muted); font-size: 13px; white-space: pre-wrap; }
.mkitem.done b { text-decoration: line-through; text-decoration-color: rgba(255,255,255,.35); color: var(--muted); }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.dmlink { margin-top: 14px; border: 0; background: none; color: var(--faint); font-size: 12px; padding: 0; text-decoration: underline; }
.dmbtn { border-color: var(--ember); color: var(--ember); }
.dmbtn[aria-pressed="true"] { background: var(--ember); color: var(--ink); }
.dmbtn[hidden], .netstate[hidden], .calbtn[hidden] { display: none; }
.calbtn { white-space: nowrap; }
@media (max-width: 860px) { #ovl.overlay { position: fixed; inset: 0; z-index: 20; padding: 12px 10px; } .cal-day { height: 42px; } }
.sheet.cal { width: min(560px, 100%); }
.cal-heute { margin: 0 0 10px; color: var(--muted); font-size: 14px; }
.cal-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 12px 0 8px; }
.cal-title { text-align: center; display: grid; }
.cal-title b { font-family: var(--f-display); font-weight: 400; font-size: 20px; }
.cal-title small { color: var(--faint); font-size: 12px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-wd { font-family: var(--f-mono); font-size: 10px; text-align: center; letter-spacing: .04em; padding: 2px 0; overflow: hidden; text-overflow: ellipsis; }
.cal-day { position: relative; height: 46px; border: 1px solid var(--line-soft); border-radius: 6px; background: var(--panel-2); color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2px; font: inherit; cursor: pointer; }
.cal-day .n { font-size: 14px; }
.cal-day .m { font-size: 12px; line-height: 1; min-height: 12px; }
.cal-day.vorbei { opacity: .62; }
.cal-day.heute { border-color: var(--ember); box-shadow: 0 0 0 1px var(--ember) inset; opacity: 1; }
.cal-day.sel { background: rgba(242,166,90,.16); }
.cal-day i, .cal-leg i { position: absolute; width: 6px; height: 6px; border-radius: 50%; }

.qcol.q-ruht .item { border-top-color: var(--hush); }
.qcol.q-erledigt .item { border-top-color: var(--ok); opacity: .82; }
.qcol .q-head .status { display: none; }
.qcol .q-name { font-family: var(--f-display); font-size: 17px; }
.qcol .q-text { font-size: 14px; line-height: 1.5; }
@media (max-width: 640px) { .qgrid { grid-template-columns: minmax(0, 1fr); } }

/* Personen: Bekanntschaften */
.np-group { margin-bottom: 26px; }
.np-group h3 { font-family: var(--f-display); font-weight: 400; font-size: 21px; color: var(--pg); margin: 0 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line-soft); }
.np-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
#ovl[data-page="npc"] .np-card { display: grid; grid-template-columns: 42px minmax(0, 1fr); column-gap: 12px; align-content: start; border: 1px solid var(--line-soft); border-radius: 8px; padding: 12px; background: var(--ink-2); }
#ovl[data-page="npc"] .np-card > :not(.np-mono) { grid-column: 2; }
#ovl[data-page="npc"] .np-card[hidden] { display: none; }
.np-mono { grid-row: 1 / span 2; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-size: 16px; color: var(--pg); border: 1.5px solid color-mix(in srgb, var(--pg) 60%, transparent); }
#ovl[data-page="npc"] .np-card > b { font-family: var(--f-display); font-weight: 400; font-size: 17px; }
#ovl[data-page="npc"] .np-card > p { margin: 3px 0 6px; font-size: 14px; line-height: 1.45; }
#ovl[data-page="npc"] .np-ort { justify-self: start; font-size: 12.5px; }
.np-von { font-size: 12.5px; color: var(--faint); margin: 2px 0 4px; }
#ovl[data-page="npc"] .np-add { margin-top: 26px; border: 1px dashed color-mix(in srgb, var(--pg) 55%, transparent); border-radius: 8px; padding: 14px 16px; max-width: 640px; }
#ovl[data-page="npc"] .np-add > b { font-family: var(--f-display); font-weight: 400; font-size: 20px; color: var(--pg); }
.np-add-hint { display: block; color: var(--muted); font-size: 13.5px; margin: 2px 0 6px; }
#ovl[data-page="npc"] .listedit select { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: inherit; }

/* Markierungen */
#ovl[data-page="marks"] .pg-aside .mkkats { display: flex; flex-wrap: wrap; gap: 6px; }
#ovl[data-page="marks"] .pg-aside .mkctl { display: grid; gap: 8px; margin-bottom: 12px; }
#ovl[data-page="marks"] .pg-aside .mkctl input:not([type="checkbox"]) { width: 100%; }
#ovl[data-page="marks"] .pg-aside .cal-sub { font-size: 13px; color: var(--faint); font-family: var(--f-body); margin: 8px 0; }
@media (min-width: 900px) { #ovl[data-page="marks"] .pg-grid { grid-template-columns: 300px minmax(0, 1fr); } }

/* Ruf: Banner je Ethnie */
.ruf-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.ruf-tile { --c: var(--hush); border: 1px solid var(--line-soft); border-top: 4px solid var(--c); border-radius: 8px; background: var(--ink-2); padding: 12px 14px 10px; }
.ruf-tile.inst { --c: var(--line); }
.ruf-tile > .rufrow { border-top: 0; padding-top: 0; }
.ruf-tile .rufname { font-family: var(--f-display); font-size: 19px; color: var(--c); }
.ruf-tile.inst .rufname { color: var(--text); }
.ruf-tile .rufrow.rufsub { margin: 10px 0 0 0; padding: 10px 0 0 12px; border-left: 2px solid color-mix(in srgb, var(--c) 50%, transparent); border-top: 1px dashed var(--line-soft); }
.ruf-tile .rufrow.rufsub .rufname { font-size: 16px; color: var(--text); }

/* Kalender: Almanach */
.pg-cal { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 36px; align-items: start; }
.pg-cal-day { border-left: 1px solid var(--line-soft); padding-left: 28px; }
#ovl[data-page="cal"] .cal-title { color: var(--pg); }
@media (max-width: 899px) { .pg-cal { grid-template-columns: minmax(0, 1fr); gap: 18px; } .pg-cal-day { border-left: 0; padding-left: 0; border-top: 1px solid var(--line-soft); padding-top: 14px; } }

/* Maßstab und Messen (19.11.2026) */
.scalebar { position: absolute; right: 16px; top: 12px; justify-items: end; z-index: 4; display: grid; gap: 3px; pointer-events: none; font-size: 12px; color: var(--text); text-shadow: 0 1px 2px #000; }
.scalebar i { display: block; height: 6px; border: 1.5px solid var(--text); border-top: 0; box-shadow: 0 1px 2px rgba(0,0,0,.6); }
.scalebar[hidden] { display: none; }
.msline { fill: none; stroke: var(--ember); stroke-width: 2.5; stroke-dasharray: 7 5; }
.msdot circle { fill: var(--ink); stroke: var(--ember); stroke-width: 2; }
.measurebox { position: absolute; right: 14px; bottom: 14px; z-index: 5; background: var(--panel); border: 1px solid var(--ember); border-radius: 10px; padding: 10px 14px; display: grid; gap: 6px; max-width: min(520px, calc(100% - 28px)); box-shadow: 0 6px 20px rgba(0,0,0,.4); }
.measurebox b { font-family: var(--f-display); font-weight: 400; font-size: 19px; color: var(--ember); }
.mstimes { border-collapse: collapse; font-size: 13px; color: var(--muted); }
.mstimes th, .mstimes td { text-align: left; padding: 3px 10px 3px 0; vertical-align: top; }
.mstimes thead th { font-weight: 400; font-size: 12px; color: var(--faint); border-bottom: 1px solid var(--line-soft); }
.mstimes tbody th { font-weight: 400; color: var(--text); white-space: nowrap; }
.mstimes td:nth-child(2) { color: var(--text); white-space: nowrap; }
.measurebox small { color: var(--faint); font-size: 12px; }
.ms-dm { font-size: 12.5px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
#btnMeasure[aria-pressed="true"] { border-color: var(--ember); color: var(--ember); }
@media (max-width: 860px) { .measurebox { left: 10px; right: 10px; bottom: 10px; max-width: none; } }
.k-tab { overflow-x: auto; margin: 6px 0 12px; }
.k-tab table { border-collapse: collapse; font-size: 13.5px; line-height: 1.4; min-width: 100%; }
.k-tab th, .k-tab td { text-align: left; vertical-align: top; padding: 6px 10px; border-bottom: 1px solid var(--line-soft); }
.k-tab th { color: var(--pg, var(--text)); font-weight: 600; border-bottom-color: var(--line); white-space: nowrap; }
.k-tab td:first-child { color: var(--text); font-weight: 600; }
/* Markierungen: kompakte Vorschau beim Darüberfahren (21.11.2026) */
.mktip { position: absolute; z-index: 30; max-width: 280px; pointer-events: none; background: rgba(15,21,34,.96); border: 1px solid var(--line); border-left: 3px solid var(--c, var(--ember)); border-radius: 8px; padding: 8px 11px; box-shadow: 0 6px 22px rgba(0,0,0,.45); font-size: 13px; line-height: 1.45; color: var(--muted); }
.mktip[hidden] { display: none; }
.mktip b { display: block; color: var(--text); font-size: 14px; margin-bottom: 2px; }
.mktip .mkt-kat { font-size: 11.5px; color: var(--faint); margin-bottom: 4px; }
.mktip .mkt-tx { display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-line; }
.qnotes { margin-top: 8px; border-top: 1px dashed var(--line-soft); padding-top: 6px; font-size: 13.5px; }
.qnotes > summary { cursor: pointer; color: var(--muted); list-style: none; display: inline-flex; align-items: center; gap: 6px; padding: 2px 0; }
.qnotes > summary::-webkit-details-marker { display: none; }
.qnotes > summary::before { content: '▸'; font-size: 11px; transition: transform .15s; }
.qnotes[open] > summary::before { transform: rotate(90deg); }
.qnotes > summary:hover, .qnotes > summary:focus-visible { color: var(--text); }
.qn-n { font-size: 11px; border: 1px solid var(--line); border-radius: 999px; padding: 0 6px; color: var(--text); }
.qnotes .note { margin: 6px 0; }

.wtext.ozt { border-left: 2px solid rgba(255,141,92,.55); padding-left: 10px; margin-top: 10px; }
.pin.heil .ring { opacity: .55; }
.ozbox { margin-top: 10px; }
.ozbox summary { cursor: pointer; font-size: 13px; }
.ozbox select, .ozbox textarea { display: block; width: 100%; margin-top: 6px; box-sizing: border-box; }
.ozbox select { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font: inherit; font-size: 13px; }

/* Handy: kompakte Kopfzeile, Infobereich als ziehbare Leiste, Querformat nebeneinander (21.11.2026) */
.sheethandle { display: none; }
@media (max-width: 860px) {
  .app, .app.view-page { grid-template-rows: auto auto minmax(0, 1fr) auto auto; }
  .bar { gap: 6px; padding-block: 6px; }
  .brand { font-size: 17px; }
  .search { flex: 1 1 120px; width: auto; min-width: 0; }
  .bar .iconbtn { padding: 4px 9px; font-size: 12.5px; }
  .crumbs { order: 5; flex: 1 1 120px; flex-basis: 120px; }
  .crumb { font-size: 13px; padding: 2px 5px; }
  .sheethandle { display: flex; grid-column: 1 / -1; justify-content: center; align-items: center; height: 22px; width: 100%; padding: 0; border: 0; border-top: 1px solid var(--line); background: var(--panel); touch-action: none; cursor: grab; }
  .sheethandle::before { content: ""; width: 44px; height: 4px; border-radius: 2px; background: var(--faint); }
  .panel { height: var(--sheet-h, 34svh); border-top: 0; transition: height .18s ease; }
  .app.sheet-drag .panel { transition: none; }
  .app.sheet-min .panel { height: 0; padding-block: 0; overflow: hidden; }
  .app.view-page .sheethandle { display: none; }
}
@media (max-height: 500px) and (orientation: landscape) {
  :root { --panel-w: min(42vw, 360px); }
  .app, .app.view-page { grid-template-columns: minmax(0, 1fr) var(--panel-w); grid-template-rows: auto auto minmax(0, 1fr); }
  .bar { flex-wrap: nowrap; padding-block: 4px; gap: 6px; }
  .brand { display: none; }
  .crumbs { order: 0; flex: 1 1 auto; flex-basis: auto; }
  .search { flex: 0 1 170px; width: auto; min-width: 0; }
  .bar .iconbtn { padding: 3px 8px; font-size: 12px; }
  .tabs { padding-top: 2px; padding-bottom: 2px; }
  .tab { font-size: 12.5px; padding: 3px 9px; }
  .stage { grid-row: 3; grid-column: 1; }
  .panel { grid-row: 3; grid-column: 2; height: auto; border-top: 0; border-left: 1px solid var(--line-soft); padding-top: 10px; }
  .app.view-page .stage { grid-column: 1 / -1; }
  .sheethandle { display: none; }
}
</style>

</head>
<body>
<div class="app" id="app">
  <header class="bar">
    <div class="brand">Aphindra<small>Gruppe</small></div>
    <nav class="crumbs" id="crumbs" aria-label="Ebenen"></nav>
    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="q" type="search" placeholder="Ort, Person, Auftrag …" autocomplete="off" aria-label="Suchen">
      <div class="results" id="results" hidden role="listbox"></div>
    </div>
    <button class="iconbtn calbtn" id="btnCal" aria-pressed="false" hidden></button>
    <button class="iconbtn" id="btnQuests" aria-pressed="false">Aufträge</button>
    <button class="iconbtn" id="btnNpcs" aria-pressed="false">Personen</button>
    <button class="iconbtn" id="btnMarks" aria-pressed="false">Markierungen</button>
    <button class="iconbtn" id="btnRuf" aria-pressed="false">Ruf</button>
    <button class="iconbtn" id="btnMeasure" aria-pressed="false" title="Entfernung auf der Weltkarte messen">Messen</button>
    <button class="iconbtn" id="btnLayers" aria-pressed="false" aria-controls="pop">Legende</button>
    <button class="iconbtn dmbtn" id="btnDM" aria-pressed="false" hidden>Spielleitung</button>
  </header>

  <main class="stage" id="stage">
    <svg id="map" role="application" aria-label="Interaktive Karte">
      <defs>
        <filter id="blur6" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter>
        <filter id="pinglow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <mask id="spot"><rect id="spotRect" fill="#fff"/><path id="spotHole" fill="#000" fill-rule="evenodd"/></mask>
      </defs>
      <g id="lyBase"></g>
      <rect id="dimRect" class="dim" mask="url(#spot)"/>
      <g id="lyFocus"></g>
      <g id="lyShapes"></g>
      <g id="lyHover"></g>
      <g id="lyRoutes"></g>
      <g id="lyCtx"></g>
      <g id="lyPins"></g>
      <g id="lyLabels"></g>
      <g id="lyMarks"></g>
      <g id="lyMeasure"></g>
    </svg>
    <div class="mapname" id="mapname"></div>
    <div class="netstate" id="netstate" hidden></div>
    <div class="pop" id="pop" hidden></div>
    <div class="hint" id="hint"><button class="hint-x" id="hintX" aria-label="Hinweis schließen">×</button><b>Fahren</b> zeigt Infos · <b>Klick</b> geht eine Ebene tiefer · <kbd>Esc</kbd> oder Brotkrümel geht zurück · Mausrad zoomt, Ziehen verschiebt</div>
    <div class="zoom">
      <button id="zin" aria-label="Hineinzoomen">+</button>
      <button id="zout" aria-label="Herauszoomen">−</button>
      <button id="zfit" aria-label="Auf aktuelle Ebene einpassen">⤢</button>
    </div>
  </main>

  <button class="sheethandle" id="sheetHandle" type="button" aria-label="Infobereich größer oder kleiner ziehen"></button>
  <aside class="panel" id="panel" aria-live="polite"></aside>
</div>

<script src="supabase.js"></script>
<script src="config.js"></script>
<script src="paths.js"></script>
<script src="struktur.js"></script>
<script>
(() => {
'use strict';
const N = window.NODES, MAPS = window.MAPS, WP = window.WORLD_PATHS;
/* ── Daten aus der gemeinsamen Ablage ── */
let W = {}, VOR = {}, Q = {}, NP = {}, G = null, NOTES = [];
let OWNER = false, DMMODE = false;
const ALLKIDS = {};
Object.values(N).forEach(n => { ALLKIDS[n.id] = (n.children || []).slice(); });
const svgNS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(svgNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const h = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ── Einstellungen (nur dieser Browser) ── */
const store = {
  get(k, d) { try { const v = localStorage.getItem('aph-' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('aph-' + k, JSON.stringify(v)); } catch {} }
};
const LAYERS = [
  { id: 'hauptstadt', name: 'Hauptstädte' },
  { id: 'siedlung', name: 'Siedlungen' },
  { id: 'schluessel', name: 'Schlüssel- & Artefaktorte' },
  { id: 'symptom', name: 'Symptome & Wunden' },
  { id: 'poi', name: 'Sonstige Orte' },
  { id: 'route', name: 'Reisewege' },
  { id: 'quest', name: 'Auftragsorte markieren' },
  { id: 'trail', name: 'Bisheriger Weg der Gruppe' },
  { id: 'marks', name: 'Eure Markierungen' },
  { id: 'labels', name: 'Beschriftungen' }
];
const on = Object.assign(Object.fromEntries(LAYERS.map(l => [l.id, true])), store.get('layers', {}));

/* ── Hilfsfunktionen für Baum & Daten ── */
const TYPE = { welt: 'Welt', domaene: 'Domäne', sonder: 'Sondergebiet', gebiet: 'Gebiet', bereich: 'Bereich', ort: 'Ort', viertel: 'Stadtbereich', route: 'Reiseweg' };
const KIND = { hauptstadt: 'Hauptstadt', siedlung: 'Siedlung', schluessel: 'Schlüsselort', symptom: 'Symptom', poi: 'Ort' };
const HUE = { amber: 'var(--amber)', teal: 'var(--teal)', gold: 'var(--gold)', mist: 'var(--mist)', sky: 'var(--sky)', violet: 'var(--violet)' };
const ancestors = id => { const out = []; let n = N[id]; while (n) { out.unshift(n.id); n = N[n.parent]; } return out; };
const hueOf = id => { for (const a of ancestors(id).reverse()) if (N[a].hue) return HUE[N[a].hue]; return 'var(--ember)'; };
const subtree = id => { const s = new Set(); const walk = i => { if (s.has(i)) return; s.add(i); (N[i].children || []).forEach(walk); }; walk(id); Object.values(N).forEach(n => { if (n.parent && s.has(n.parent)) s.add(n.id); }); return s; };
const mapOf = id => { for (const a of ancestors(id).reverse()) { const n = N[a]; if (n.map && (n.pt || n.type === 'welt' || n.type === 'viertel') && a !== id) return n.map; } return 'world'; };
const mapOK = id => DMMODE || id === 'world' || !!(W[id] && W[id].karte);
const ownMap = id => N[id].map && N[id].map !== mapOf(id) && mapOK(id) ? N[id].map : null;
const kindOf = n => n.kind || (n.type === 'viertel' ? 'viertel' : 'poi');
const isPin = n => !!(n.pt || n.schemaPt);
const known = id => !!W[id];
let QSET = {};
const ACTIVE = new Set(['aktiv', 'offen']);
const STATI = ['aktiv', 'offen', 'ruht', 'erledigt'];
const statusCls = s => s === 'aktiv' ? 'st-aktiv' : s === 'offen' ? 'st-next' : s === 'erledigt' ? 'st-hidden' : 'st-offen';
const statusRank = s => STATI.indexOf(s);
const qList = () => Object.entries(Q).map(([id, q]) => Object.assign({ id, orte: [] }, q)).sort((a, b) => statusRank(a.status) - statusRank(b.status) || (a.ord || 99) - (b.ord || 99));
/* Baum an den Wissensstand anpassen: unbekannte Orte fehlen, gesperrte Karten haben keine Unterorte */
function rebuildTree() {
  Object.entries(VOR).forEach(([id, v]) => { if (v.geo && !N[id] && (W[id] || DMMODE)) { N[id] = Object.assign({}, v.geo, { injected: true }); ALLKIDS[id] = ALLKIDS[id] || []; } });
  Object.keys(N).forEach(id => { if (N[id].injected && !(W[id] || DMMODE)) delete N[id]; });
  Object.values(N).forEach(n => { if (n.injected && N[n.parent] && !ALLKIDS[n.parent].includes(n.id)) ALLKIDS[n.parent].push(n.id); });
  Object.values(N).forEach(n => {
    const locked = n.map && n.id !== 'world' && !mapOK(n.id) && n.map !== mapOfRaw(n.id);
    n.children = locked ? [] : ALLKIDS[n.id].filter(c => N[c] && (DMMODE || !isPin(N[c]) || known(c)));
  });
  QSET = {};
  qList().forEach(q => (q.orte || []).forEach(o => { (QSET[o] = QSET[o] || []).push(q); }));
}
function mapOfRaw(id) { const chain = []; let n = N[id]; while (n) { chain.unshift(n.id); n = N[n.parent]; } for (const a of chain.reverse()) { const m = N[a]; if (m.map && (m.pt || m.type === 'welt' || m.type === 'viertel') && a !== id) return m.map; } return 'world'; }

/* ── Koordinaten ── */
let M = MAPS.world, A = M.h / M.w;
const P = ([x, y]) => [x, y * A];
const polyD = pts => 'M' + pts.map(p => P(p).map(v => v.toFixed(1)).join(' ')).join('L') + 'Z';
const ellD = ([cx, cy, rx, ry]) => { const [x, y] = P([cx, cy]); const r2 = ry * A; return `M${x - rx} ${y}a${rx} ${r2} 0 1 0 ${2 * rx} 0a${rx} ${r2} 0 1 0 ${-2 * rx} 0Z`; };
const shapeD = n => n.shape ? WP[n.shape.d] : n.rings ? n.rings.map(polyD).join('') : n.poly ? polyD(n.poly) : n.ellipse ? ellD(n.ellipse) : n.schemaShape ? SCHEMA_SHAPES[n.schemaShape] : null;
const ptOf = n => n.pt ? P(n.pt) : n.schemaPt ? n.schemaPt : null;

/* ── Schemakarten (gezeichnet, keine Kartenvorlage) ── */
const circ = (cx, cy, r) => `M${cx - r} ${cy}a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 ${-2 * r} 0Z`;
const ell = (cx, cy, rx, ry) => `M${cx - rx} ${cy}a${rx} ${ry} 0 1 0 ${2 * rx} 0a${rx} ${ry} 0 1 0 ${-2 * rx} 0Z`;
const SCHEMA_SHAPES = {
  aussen: ell(500, 400, 470, 345) + ell(500, 400, 330, 250),
  zugang2: 'M820 430L955 395L965 455L828 478Z',
  karawane: circ(500, 182, 46),
  rand: circ(372, 220, 32) + circ(630, 214, 34) + circ(300, 318, 28),
  markt: circ(330, 430, 66),
  garten: circ(682, 418, 58),
  feuerauge: circ(500, 428, 92),
  gildenhaus: 'M426 392L470 380L478 470L432 468Z',
  archiv: circ(500, 360, 15),
  akademie: circ(560, 402, 18),
  glutfokus: circ(505, 430, 24),
  zisternen: ell(505, 480, 34, 11),
  anleger: 'M360 60L640 60L650 205L600 205L590 120L540 120L530 205L470 205L460 120L410 120L400 205L350 205Z',
  umschlag: 'M380 225L620 225L640 330L360 330Z',
  lager: 'M215 205L335 205L335 262L215 262Z',
  rauchhaus: 'M660 255L785 255L785 335L660 335Z',
  vandrik: 'M290 385L360 385L360 438L290 438Z',
  stell: 'M300 575L705 575L725 690L280 690Z',
  wegbrunnen: 'M0 440L210 425L215 452L0 470Z',

    if (!('x0' in ds)) { ds.x0 = t.getAttribute('x'); ds.y0 = t.getAttribute('y'); ds.a0 = t.getAttribute('text-anchor') || 'start'; ds.f0 = t.getAttribute('font-size') || ''; }
    let cands;
    if (kind === 'area') {
      const x0 = +ds.x0, y0 = +ds.y0, step = (+ds.fs || 14) * k * 1.1;
      cands = [[0, 0], [0, -step], [0, step], [step * 2, 0], [-step * 2, 0], [0, -2 * step], [0, 2 * step]].map(([dx, dy]) => [x0 + dx, y0 + dy, 'middle']);
    } else if (kind === 'party') {
      cands = [[-10, -10, 'end'], [10, -10, 'start'], [-10, 16, 'end'], [10, 16, 'start'], [0, -15, 'middle'], [0, 22, 'middle']];
    } else cands = PIN_CANDS;
    const set = (c, f) => {
      t.setAttribute('x', c[0]); t.setAttribute('y', c[1]); t.setAttribute('text-anchor', c[2]);
      if (kind === 'area') { ds.ff = f; t.setAttribute('font-size', ((+ds.fs || 14) * k * f).toFixed(2)); }
      else if (ds.f0) t.setAttribute('font-size', (+ds.f0 * f).toFixed(2));
    };
    let best = null;
    outer: for (const f of SIZES) {
      for (let i = 0; i < cands.length; i++) {
        set(cands[i], f);
        const r = rectOf(t, 1), a = Math.max(1, (r.r - r.l) * (r.b - r.t));
        let hit = 0; for (const p of placed) hit += overlapArea(r, p);
        const off = Math.max(0, box.left - r.l) + Math.max(0, r.r - box.right) + Math.max(0, box.top - r.t) + Math.max(0, r.b - box.bottom);
        const ms = maskShare(mask, r, inv), score = hit / a * 10 + ms * 8 + off / 20 + i * 0.02 + (1 - f) * 0.6;
        if (!best || score < best.score) best = { score, c: cands[i], f, r };
        if (hit === 0 && off === 0 && ms < 0.03) break outer;
      }
    }
    if (best) { set(best.c, best.f); placed.push(best.r); }
  });
}
addEventListener('resize', scheduleLabels);

/* ── Markierungen: Vorschau beim Darüberfahren oder bei Tastaturfokus (21.11.2026) ── */
(function markTips() {
  const tip = h('div', 'mktip'); tip.hidden = true; tip.setAttribute('role', 'tooltip'); tip.id = 'mktip';
  const host = svg.parentNode; if (getComputedStyle(host).position === 'static') host.style.position = 'relative'; host.appendChild(tip);
  let cur = null;
  const show = g => {
    const m = MARKS.find(x => x.id === g.dataset.mk); if (!m) return;
    const k = mkat(m.kategorie), bits = [k.name];
    if (k.quest && m.status) bits.push(m.status);
    if (m.fuer) bits.push('für ' + m.fuer);
    const d = markDate(m); if (d) bits.push(d);
    tip.style.setProperty('--c', k.c);
    tip.innerHTML = `<b>${esc(m.name || 'ohne Namen')}</b><div class="mkt-kat">${esc(bits.join(' · '))}</div>` + (m.text ? `<div class="mkt-tx">${esc(m.text.length > 400 ? m.text.slice(0, 400) + ' …' : m.text)}</div>` : '<div class="mkt-tx"><i>noch keine Beschreibung</i></div>');
    tip.hidden = false; cur = g; place();
  };
  const place = () => {
    if (!cur || tip.hidden) return;
    const r = cur.getBoundingClientRect(), hb = host.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
    let x = r.right - hb.left + 8, y = r.top - hb.top - 4;
    if (x + tw > hb.width - 8) x = r.left - hb.left - tw - 8;
    if (y + th > hb.height - 8) y = hb.height - th - 8;
    tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px';
  };
  const hide = () => { tip.hidden = true; cur = null; };
  svg.addEventListener('pointerover', e => { if (e.pointerType === 'touch') return; const g = e.target.closest && e.target.closest('g.mark'); if (g && g !== cur) show(g); });
  svg.addEventListener('pointerout', e => { const g = e.target.closest && e.target.closest('g.mark'); if (g && !(e.relatedTarget && g.contains(e.relatedTarget))) hide(); });
  svg.addEventListener('focusin', e => { const g = e.target.closest && e.target.closest('g.mark'); if (g) show(g); });
  svg.addEventListener('focusout', hide);
  svg.addEventListener('pointerdown', hide);
  svg.addEventListener('wheel', hide, { passive: true });
})();

/* ── Notizen zu Aufträgen (21.11.2026): gespeichert in „notiz“ mit ort = 'q:' + Auftrag ── */
const QNOPEN = new Set();
function questNotes(q) {
  const key = 'q:' + q.id, notes = NOTES.filter(x => x.ort === key).sort((a, b) => (a.erstellt < b.erstellt ? -1 : 1));
  const d = h('details', 'qnotes'); if (QNOPEN.has(q.id)) d.open = true;
  d.addEventListener('toggle', () => { if (d.open) QNOPEN.add(q.id); else QNOPEN.delete(q.id); });
  const s = h('summary', null, `Eure Notizen${notes.length ? ` <span class="qn-n">${notes.length}</span>` : ''}`); d.appendChild(s);
  notes.forEach(x => d.appendChild(noteEl(x)));
  if (!sb) { if (!notes.length) d.appendChild(h('p', 'empty', 'Noch keine Notizen.')); return d; }
  const f = h('form', 'noteform');
  const nm = store.get('name', '');
  f.innerHTML = `<input type="text" maxlength="40" placeholder="Dein Name" aria-label="Dein Name" value="${esc(nm)}"${nm ? ' hidden' : ''}><textarea rows="2" maxlength="1200" placeholder="Notiz zu „${esc(q.name)}“ …" aria-label="Notiz zu ${esc(q.name)}"></textarea><button class="iconbtn" type="submit">Notiz speichern</button>`;
  const nameIn = f.querySelector('input'), ta = f.querySelector('textarea');
  if (nm) { const line = h('div', 'who'); line.innerHTML = `<span>Du schreibst als <b>${esc(nm)}</b></span>`; const ch = h('button', null, 'Name ändern'); ch.type = 'button'; ch.onclick = () => { line.hidden = true; nameIn.hidden = false; nameIn.focus(); nameIn.select(); }; line.appendChild(ch); f.insertBefore(line, f.firstChild); }
  f.onsubmit = e => {
    e.preventDefault(); const v = ta.value.trim(); if (!v) return;
    const n2 = nameIn.value.trim(); if (!n2) { nameIn.hidden = false; nameIn.focus(); return say('Bitte zuerst deinen Namen eintragen.', 3000); }
    store.set('name', n2); QNOPEN.add(q.id);
    addNote(key, v).then(ok => { if (ok) { ta.value = ''; if (ovlKind === 'quest') renderOverlay(true); } });
  };
  d.appendChild(f);
  return d;
}

/* ── Zustand eines Ortes vor/nach der Heilung eines Symptoms ── */
let OZ = {};
LOADERS.ort_zustand = rows => { OZ = toMapById(rows); };
OPTIONAL.add('ort_zustand');
const ozHeil = id => { const z = OZ[id]; return !!(z && SY[z.symptom] && SY[z.symptom].geheilt); };
const ozText = id => { const z = OZ[id]; if (!z) return ''; return ((ozHeil(id) ? z.nach : z.vor) || '').trim(); };
function ozBox(id) {
  const z = OZ[id] || {}, d = h('details', 'ozbox'); if (z.symptom) d.open = true;
  d.appendChild(h('summary', null, 'Zustand vor und nach der Heilung'));
  const sel = h('select'); sel.setAttribute('aria-label', 'Symptom');
  const o0 = h('option', null, 'kein Symptom'); o0.value = ''; sel.appendChild(o0);
  Object.values(SY).sort((a, b) => (a.ord ?? 99) - (b.ord ?? 99)).forEach(sy => { const op = h('option', null, esc(sy.name) + (sy.geheilt ? ' (geheilt)' : '')); op.value = sy.id; if (z.symptom === sy.id) op.selected = true; sel.appendChild(op); });
  d.appendChild(sel);
  const mk = (val, ph, lab) => { const t = h('textarea'); t.rows = 3; t.value = val || ''; t.placeholder = ph; t.setAttribute('aria-label', lab); d.appendChild(t); return t; };
  const tv = mk(z.vor, 'Solange das Symptom aktiv ist …', 'Text vor der Heilung');
  const tn = mk(z.nach, 'Nach der Heilung …', 'Text nach der Heilung');
  d.appendChild(h('div', 'state', 'Die Gruppe sieht den passenden Text unter der Ortsbeschreibung, sobald der Ort freigegeben ist.'));
  const row = h('div', 'btnrow'), sv = h('button', 'iconbtn', 'Zustand speichern');
  sv.onclick = () => {
    if (!sel.value) return OZ[id] ? write(() => del('ort_zustand', id), 'Zustand entfernt.').then(() => renderPanel(true)) : say('Bitte ein Symptom wählen.');
    write(() => put('ort_zustand', { id, symptom: sel.value, vor: tv.value.trim() || null, nach: tn.value.trim() || null, geaendert: new Date().toISOString() }), 'Gespeichert.').then(() => renderPanel(true));
  };
  row.appendChild(sv); d.appendChild(row);
  return d;
}


/* ── Handy: Infobereich ziehen oder antippen ── */
(function sheet() {
  const app = $('app'), hd = $('sheetHandle'), pn = $('panel');
  if (!hd) return;
  const vh = () => window.innerHeight;
  const relayout = () => requestAnimationFrame(() => dispatchEvent(new Event('resize')));
  const setH = px => { if (px === null) app.style.removeProperty('--sheet-h'); else app.style.setProperty('--sheet-h', Math.round(px) + 'px'); };
  let y0 = 0, h0 = 0, moved = false, id = null;
  hd.addEventListener('pointerdown', e => { id = e.pointerId; hd.setPointerCapture(id); y0 = e.clientY; h0 = app.classList.contains('sheet-min') ? 0 : pn.getBoundingClientRect().height; moved = false; app.classList.add('sheet-drag'); });
  hd.addEventListener('pointermove', e => {
    if (id !== e.pointerId) return;
    const dy = y0 - e.clientY; if (Math.abs(dy) > 6) moved = true; if (!moved) return;
    app.classList.remove('sheet-min'); setH(Math.max(0, Math.min(vh() * .75, h0 + dy)));
  });
  const end = e => {
    if (id !== e.pointerId) return; id = null; app.classList.remove('sheet-drag');
    if (!moved) { app.classList.toggle('sheet-min'); relayout(); return; }
    const h = pn.getBoundingClientRect().height;
    if (h < vh() * .12) { app.classList.add('sheet-min'); setH(null); }
    relayout();
  };
  hd.addEventListener('pointerup', end); hd.addEventListener('pointercancel', end);
  hd.addEventListener('keydown', e => { if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { e.preventDefault(); const cur = app.classList.contains('sheet-min') ? 0 : pn.getBoundingClientRect().height; if (e.key === 'ArrowDown' && cur < vh() * .2) { app.classList.add('sheet-min'); } else { app.classList.remove('sheet-min'); setH(Math.max(vh() * .15, Math.min(vh() * .75, cur + (e.key === 'ArrowUp' ? 1 : -1) * vh() * .15))); } relayout(); } });
  window.openSheet = () => { if (app.classList.contains('sheet-min')) { app.classList.remove('sheet-min'); relayout(); } };
})();

else connect();
